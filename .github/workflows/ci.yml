name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Versions
        run: node -v && npm -v

      - name: Install
        run: npm ci --no-audit --no-fund

      # public/cv/*.pdf is not tracked: it is generated from the Base64 sources
      # in scripts/cv-b64/, which are ASCII and therefore cannot be damaged by a
      # text-only channel. Restoring here means every following step sees a
      # complete tree, and a checksum mismatch fails the job before Build.
      - name: Restore generated binaries
        run: node scripts/restore-cv.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7
