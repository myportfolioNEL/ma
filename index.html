    <!-- Fonts: preconnect first, then one stylesheet request. display=swap so
         text is readable before the webfont lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      (function() {
        try {
          var originalFetchDescriptor = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (originalFetchDescriptor && !originalFetchDescriptor.set) {
            var currentValue = originalFetchDescriptor.get ? originalFetchDescriptor.get.call(window) : originalFetchDescriptor.value;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentValue; },
              set: function(val) { currentValue = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>

    <!-- The hero image and portrait live on another origin; warm it up early. -->
    <link rel="preconnect" href="https://noureddinelmobaraki-web.github.io" />

    <!-- The first window's poster. Fetched with the document instead of after
         the lazy loader decides it is nearly visible. This href follows
         DISPLAY_ORDER in src/data/projects.ts: MOMENTO is the first window, so
         MOMENTO's poster is the one worth a high-priority preload. NL's own
         poster is now third and is fetched lazily like the second one. -->
    <link
      rel="preload"
      as="image"
      href="https://noureddinelmobaraki-web.github.io/nl-audio-cdn/BG.SITES/2.png"
      fetchpriority="high"
    />

    <!-- The two other project origins are only contacted if a live preview is
         actually armed, so they get a DNS lookup and nothing more. -->
    <link rel="dns-prefetch" href="https://prismmoo.github.io" />
    <link rel="dns-prefetch" href="https://momentowatch.github.io" />
